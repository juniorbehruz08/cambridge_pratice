<!doctype html>
{% load static %}
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Cambridge Practice</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <a class="brand auth-brand" href="{% url 'cambridge_practice:home' %}">
                <span class="brand-mark">CP</span>
                <span>Cambridge Practice</span>
            </a>

            <div class="auth-heading">
                <p class="eyebrow">Welcome back</p>
                <h1>Sign in</h1>
                <p>Use your account to access the available Cambridge practice library.</p>
            </div>

            <form method="post" class="auth-form">
                {% csrf_token %}
                {{ form.non_field_errors }}
                <div class="form-fields">
                    {{ form.as_p }}
                </div>
                <button class="button primary full-button" type="submit">Sign in</button>
            </form>

            <p class="auth-switch">
                New here?
                <a href="{% url 'cambridge_practice:register' %}">Create an account</a>
            </p>
        </section>
    </main>
</body>
</html>
