    <rect x="55" y="30" width="48" height="48" fill="#fff" stroke="#111" stroke-width="4"/><text x="79" y="55">A</text>
    <rect x="596" y="185" width="48" height="48" fill="#fff" stroke="#111" stroke-width="4"/><text x="620" y="210">B</text>
    <rect x="674" y="363" width="48" height="48" fill="#fff" stroke="#111" stroke-width="4"/><text x="698" y="388">C</text>
    <rect x="862" y="535" width="48" height="48" fill="#fff" stroke="#111" stroke-width="4"/><text x="886" y="560">D</text>
    <rect x="862" y="632" width="48" height="48" fill="#fff" stroke="#111" stroke-width="4"/><text x="886" y="657">E</text>
    <rect x="512" y="700" width="48" height="48" fill="#fff" stroke="#111" stroke-width="4"/><text x="536" y="725">F</text>
    <rect x="648" y="715" width="48" height="48" fill="#fff" stroke="#111" stroke-width="4"/><text x="672" y="740">G</text>
    <rect x="861" y="754" width="48" height="48" fill="#fff" stroke="#111" stroke-width="4"/><text x="885" y="779">H</text>
    <rect x="470" y="789" width="48" height="48" fill="#fff" stroke="#111" stroke-width="4"/><text x="494" y="814">I</text>
