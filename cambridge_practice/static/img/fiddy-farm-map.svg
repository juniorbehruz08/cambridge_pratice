<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 960" role="img" aria-labelledby="title desc">
  <title id="title">Fiddy Working Heritage Farm map</title>
  <desc id="desc">Black and white farm map with labels A to I, road, footpath, farm yard, main path, fish pool, car park, side path, new barn and you are here marker.</desc>
  <defs>
    <pattern id="brickHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#111" stroke-width="2"/>
      <line x1="5" y1="0" x2="5" y2="10" stroke="#111" stroke-width=".7"/>
    </pattern>
    <pattern id="barnHatch" width="12" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 2 H12 M2 5 H14" stroke="#111" stroke-width="1.4"/>
    </pattern>
  </defs>

  <rect width="1000" height="960" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" stroke-linecap="square" stroke-linejoin="miter">
