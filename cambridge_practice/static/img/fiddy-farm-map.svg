    <line x1="18" y1="78" x2="982" y2="78" stroke="#111" stroke-width="4"/>
    <line x1="18" y1="128" x2="982" y2="128" stroke="#111" stroke-width="4"/>
    <text x="220" y="114" font-size="31" font-weight="700">Road</text>

