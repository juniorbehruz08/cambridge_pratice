    <path d="M121 128 C218 208 307 306 436 346 C486 362 535 382 584 398" fill="none" stroke="#111" stroke-width="2.5" stroke-dasharray="8 10"/>
    <path d="M146 128 C242 220 324 322 448 365 C496 382 542 400 584 414" fill="none" stroke="#111" stroke-width="2.5" stroke-dasharray="8 10"/>
    <text x="270" y="260" transform="rotate(48 270 260)" font-size="32" font-weight="700">Footpath</text>

    <text x="438" y="190" font-size="34" font-weight="700">Farm Yard</text>
    <path d="M483 303 L577 342 L611 224 L643 238 L603 370 L468 329 Z" fill="url(#brickHatch)" stroke="#111" stroke-width="3"/>
    <path d="M489 322 L589 364 L616 269" fill="none" stroke="#111" stroke-width="2"/>

    <path d="M425 441 C395 428 362 431 344 457 C323 487 351 511 386 504 C425 496 465 507 519 508 C546 509 566 498 563 474 C559 444 506 436 476 448 Z" fill="#fff" stroke="#111" stroke-width="4"/>
    <path d="M606 448 C648 427 719 429 750 457 C769 475 754 505 719 509 C671 515 629 504 582 508 C562 510 552 489 564 470 C574 456 591 456 606 448 Z" fill="#fff" stroke="#111" stroke-width="4"/>
    <text x="462" y="483" font-size="32" font-weight="700">Fish</text>
    <text x="640" y="483" font-size="32" font-weight="700">Pool</text>

    <rect x="557" y="443" width="57" height="56" fill="#fff" stroke="#111" stroke-width="4"/>
    <line x1="557" y1="455" x2="614" y2="455" stroke="#111" stroke-width="2"/>
    <line x1="557" y1="466" x2="614" y2="466" stroke="#111" stroke-width="2"/>
    <line x1="557" y1="478" x2="614" y2="478" stroke="#111" stroke-width="2"/>
    <line x1="557" y1="489" x2="614" y2="489" stroke="#111" stroke-width="2"/>

