    <path d="M626 386 L626 804" stroke="#111" stroke-width="4"/>
    <text x="605" y="675" transform="rotate(-90 605 675)" font-size="31" font-weight="700">Main Path</text>

    <path d="M626 498 H813 Q847 498 847 534 V784 Q847 818 813 818 H626" fill="none" stroke="#111" stroke-width="4"/>
    <rect x="625" y="535" width="198" height="268" fill="none" stroke="#111" stroke-width="4"/>
    <text x="841" y="704" transform="rotate(-90 841 704)" font-size="31" font-weight="700">Side Path</text>

    <rect x="304" y="688" width="280" height="235" fill="none" stroke="#111" stroke-width="4"/>
    <path d="M455 805 H584" stroke="#111" stroke-width="4"/>
    <path d="M455 846 H584" stroke="#111" stroke-width="4"/>
    <text x="337" y="775" font-size="31" font-weight="700">Car Park</text>

